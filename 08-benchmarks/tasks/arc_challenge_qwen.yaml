task: arc_challenge_qwen
dataset_path: allenai/ai2_arc
dataset_name: ARC-Challenge
test_split: test
process_docs: !function qwen_utils.arc_docs
output_type: generate_until
doc_to_text: !function qwen_utils.arc_text
doc_to_target: !function qwen_utils.arc_target
num_fewshot: 0
generation_kwargs:
  until: []
  max_gen_toks: 4096
filter_list:
  - name: last-answer
    filter:
      - function: regex
        regex_pattern: 'answer is \(?([A-J])\)?'
        group_select: -1
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
